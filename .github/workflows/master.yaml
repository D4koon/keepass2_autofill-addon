name: Master CI
on:
  push:
    branches: [ master ]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Prepare system path for running python
        run: echo "/home/runner/.local/bin" >> $GITHUB_PATH

      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
        #TODO: change to 1 and then get all tags seperately to see if that's faster. git fetch origin 'refs/tags/*:refs/tags/*'

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: 'npm'

      # Create a git tag of the new version to use
      # If package.json major and minor versions match last tag, then 
      # increment last tag. Else use package.json major.minor.0.
      - name: Create git tag
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          KEE_VERSION_MANIFEST=`sed -nE 's/^.*"version": "([0-9]{1,}\\.[0-9]{1,})\\.[0-9x]{1,}"\\,/\\1/p' package.json | tr -d '\\040\\011\\012\\015'`; KEE_VERSION_TAG=`git describe --abbrev=0 --tags | sed -E 's/^([0-9]{1,}\\.[0-9]{1,})\\.([0-9]{1,})$/\\1 \\2/g'`; echo "${KEE_VERSION_MANIFEST} ${KEE_VERSION_TAG}" | awk '{printf($1==$2?""$2"."$3+1:""$1".0")}' | xargs -I {} git tag -a {} -m "{}"

      - name: Update package.json based on the git tag we just created
        run: |
          NEW_KEE_VERSION=`git describe --abbrev=0 --tags`
          echo "NEW_KEE_VERSION=$NEW_KEE_VERSION" >> $GITHUB_ENV
          sed -E 's/^(.*"version": ")(.*)("\,.*)/\1'"$NEW_KEE_VERSION"'\3/' package.json > package.json.tmp && mv package.json.tmp package.json
          # Commit the bump and move the (still local) tag onto it so the tagged source,
          # including GitHub's "Source code" archive, matches the released version.
          git diff --quiet package.json || git commit -m "Release $NEW_KEE_VERSION" package.json
          git tag -f -a "$NEW_KEE_VERSION" -m "$NEW_KEE_VERSION"

      - name: Setup
        run: |
          npm ci
          mkdir dist

      - name: Build and package beta
        run: npm run build:beta && npm run pack:beta

      - name: Build and package production
        run: npm run build:prod && npm run pack:prod

      - name: Build and package Chrome beta
        run: npm run build-chrome:beta && npm run pack-chrome:beta

      - name: Build and package Chrome production
        run: npm run build-chrome:prod && npm run pack-chrome:prod

      # We have to do this type check after running the build
      # because Vite creates various type definitions we need
      - name: Compile Typescript
        run: npm run tsc

      - name: Test
        run: npm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage-${{ github.job }}
          path: coverage/
          retention-days: 14

      - name: Lint
        run: npm run lint

      # ./extension holds the last build (Chrome), so rebuild the Firefox production
      # build and sign that. Unlisted add-ons are signed automatically, usually
      # within minutes; web-ext waits and downloads the signed .xpi.
      # Runs before the push so a failed signing does not leave a tag behind.
      - name: Sign Firefox build with Mozilla
        run: |
          npm run build:prod
          npm run sign:xpi:beta
          mv dist/signed/*.xpi "dist/signed/keelink-$NEW_KEE_VERSION-firefox-signed.xpi"
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_API_KEY }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_API_SECRET }}

      - name: Push version commit and git tag
        run: |
          git push origin HEAD:refs/heads/${{ github.ref_name }}
          git push origin "$NEW_KEE_VERSION"

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ env.NEW_KEE_VERSION }}
          tag_name: ${{ env.NEW_KEE_VERSION }}
          fail_on_unmatched_files: true
          prerelease: true
          body: "Firefox: install keelink-${{ env.NEW_KEE_VERSION }}-firefox-signed.xpi (signed by Mozilla) by opening it in Firefox. The other .xpi files are unsigned and only useful for testing. Chrome/Edge: the .zip files can be loaded unpacked in developer mode."
          files: |
            dist/*.xpi
            dist/*.zip
            dist/signed/*.xpi
